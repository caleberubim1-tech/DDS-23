<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 2</title>
    <link rel="icon"
        href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZW4D8frePXs6PCQrltWgRhDW8NgMvn1d95g&s">
</head>

<body>
    <h1>Tabela Incrível</h1>

    <table border="5">

        <!-- cabeçalho da tabela -->
        <thead>
            <tr>
                <th>NOME</th>
                <th>ITEM</th>
                <th>QUANTIDADE</th>
                <th>PREÇO</th>
            </tr>
        </thead>

        <!-- corpo da tabela -->
        <tbody>
            <!-- Crio uma linha -->
            <tr>
                <!-- Crio uma coluna -->
                <td>HULK</td>
                <td>PERFUME</td>
                <td>10</td>
                <td>R$ 100,00</td>
            </tr>
            <!-- tr*2>td*4{OI} usado para agilizar -->
            <tr>
                <td>Neymar</td>
                <td>Ilha do boi </td>
                <td>1</td>
                <td>R$ 5 tri</td>
            </tr>
            <tr>
                <td>Senai</td>
                <td>Curso de HTML</td>
                <td>1</td>
                <td>R$ 100,00</td>
            </tr>
            <tr>
                <!-- Rowspan diz quantas linhas ele deve ocupar -->
                <td rowspan="2">Galo</td>
                <td>Hulk</td>
                <td>1</td>
                <td>R$ 2 bi</td>
            </tr>
        </tbody>

        <!-- rodape da tabela -->
        <tfoot>
            <td colspan="4">
                Todos os direitos estão reservados &copy;
            </td>
        </tfoot>

    </table>
</body>

</html>
